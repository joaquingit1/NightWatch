[project]
name = "nightwatch-server"
version = "0.1.0"
description = "Night Watch FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "websockets>=13.0,<15",
    "requests>=2.32.0",
    "qrcode>=8.2",
    "pypng>=0.20220715.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
