[project]
name = "nightwatch"
version = "0.1.0"
description = "Night Watch: rest-guardian blueprints for Unitree Go2 on DimensionalOS"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."dimos.blueprints"]
scout = "nightwatch.blueprints:scout"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nightwatch"]
