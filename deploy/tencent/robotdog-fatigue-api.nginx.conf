server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 82.157.96.225 _;

    client_max_body_size 1m;

    # The public Next.js form remains on the venue host.
    location = /form {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /form/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Both halves of the interaction go through the same local RobotBridge.
    # Serving schema from a cloud stub would lose the active interaction token;
    # mirroring only POST would therefore never be able to command the dog.
    location = /api/form/schema {
        proxy_pass http://127.0.0.1:18020;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /api/form/responses {
        proxy_pass http://127.0.0.1:18020;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Do not expose operator queues, status mutation, video, or robot controls.
    location ^~ /api/form/ {
        return 404;
    }

    location / {
        return 404;
    }
}
